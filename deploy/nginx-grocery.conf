# Include INSIDE the existing HTTPS server block for hadol.deydas.com.
# This file is a location snippet, not a complete Nginx site configuration.
# Inspect existing locations before adding it; preserve other routes and TLS.

location = /grocery {
    return 308 /grocery/;
}

location ^~ /grocery/ {
    # No trailing slash: the application receives the /grocery/ prefix.
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    client_max_body_size 16k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_intercept_errors off;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    # The application supplies Cache-Control: no-store. No CDN/proxy cache
    # should override it. Polling does not need a websocket/SSE upgrade.
    # Private keys are URL fragments exchanged in POST bodies. Never enable
    # request-body, cookie, or debug logging for this location.
    access_log off;
}
